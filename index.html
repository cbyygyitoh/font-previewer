<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体工坊</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='85' font-family='serif'>✍️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .main-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .toolbar {
            padding: 4px 10px;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 100;
            min-height: 36px;
            max-height: 44px;
            overflow-y: auto;
            position: relative;
        }
        .toolbar input,
        .toolbar select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            height: 24px;
        }
        .toolbar select {
            cursor: pointer;
            min-width: 50px;
        }
        .toolbar select:focus,
        .toolbar input:focus {
            outline: none;
            border-color: #666;
        }
        .toolbar select option {
            background: #1a1a1a;
        }
        .toolbar label {
            color: #aaa;
            font-size: 10px;
            margin-right: 1px;
            font-weight: 500;
        }
        .toolbar .sep {
            color: #333;
            font-size: 10px;
            margin: 0 2px;
        }

        .option-btn {
            background: #2a2a4a;
            border: 1px solid #444;
            color: #aaa;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }
        .option-btn:hover {
            background: #3a3a5a;
            color: #fff;
            border-color: #555;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .toolbar-right .label-current {
            color: #888;
            font-size: 10px;
            white-space: nowrap;
        }

        .toolbar-font-selector {
            position: relative;
            display: inline-block;
        }
        .toolbar-font-selector .font-toggle {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            min-width: 130px;
            max-width: 200px;
            justify-content: space-between;
            white-space: nowrap;
        }
        .toolbar-font-selector .font-toggle:hover {
            border-color: #555;
        }
        .toolbar-font-selector .font-toggle .font-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .toolbar-font-selector .font-toggle .arrow {
            font-size: 9px;
            transition: transform 0.3s;
            color: #555;
            flex-shrink: 0;
        }
        .toolbar-font-selector .font-toggle .arrow.open {
            transform: rotate(180deg);
        }
        .toolbar-font-selector .font-toggle .pin-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            padding: 0 2px;
            flex-shrink: 0;
            transition: color 0.3s;
            border-radius: 3px;
        }
        .toolbar-font-selector .font-toggle .pin-btn:hover {
            color: #aaa;
            background: rgba(255,255,255,0.05);
        }
        .toolbar-font-selector .font-toggle .pin-btn.pinned {
            color: #ffa500;
            background: rgba(255,165,0,0.1);
        }

        .font-sidebar {
            display: none;
            position: fixed;
            right: 0;
            top: 44px;
            bottom: 0;
            background: rgba(16, 16, 16, 0.97);
            border-left: 1px solid #333;
            padding: 6px 0;
            overflow-y: auto;
            min-width: 200px;
            max-width: 280px;
            z-index: 99999999;
            box-shadow: -4px 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }
        .font-sidebar.show {
            display: block;
        }
        .font-sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .font-sidebar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
        .font-sidebar .sidebar-title {
            color: #555;
            font-size: 10px;
            padding: 4px 16px 8px;
            border-bottom: 1px solid #2a2a2a;
            text-align: center;
            letter-spacing: 2px;
            position: sticky;
            top: 0;
            background: rgba(16, 16, 16, 0.95);
            z-index: 1;
        }
        .font-sidebar .sidebar-title .pin-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            margin-right: 6px;
            transition: background 0.3s;
        }
        .font-sidebar .sidebar-title .pin-indicator.pinned {
            background: #ffa500;
            box-shadow: 0 0 8px rgba(255,165,0,0.3);
        }
        .font-sidebar .sidebar-item {
            padding: 5px 16px;
            cursor: pointer;
            color: #aaa;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
            border-left: 2px solid transparent;
        }
        .font-sidebar .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .font-sidebar .sidebar-item.active {
            color: #ffa500;
            border-left-color: #ffa500;
            background: rgba(255, 165, 0, 0.06);
        }
        .font-sidebar .sidebar-item .tag {
            color: #666;
            font-size: 9px;
            margin-left: 6px;
        }

        .folder-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px 32px;
            max-width: 400px;
            width: 90%;
            z-index: 9999999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            text-align: center;
        }
        .folder-panel.active {
            display: block;
        }
        .folder-panel .folder-title {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .folder-panel .folder-sub {
            color: #666;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .folder-panel .folder-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .folder-panel .folder-item {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            color: #ccc;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .folder-panel .folder-item:hover {
            background: #2a2a2a;
            border-color: #555;
            color: #fff;
        }
        .folder-panel .folder-item .count {
            color: #555;
            font-size: 11px;
        }

        .folder-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999998;
            backdrop-filter: blur(6px);
        }
        .folder-overlay.active {
            display: block;
        }

        .text-input-wrapper {
            position: relative;
            flex: 0 1 auto;
            min-width: 70px;
            max-width: 140px;
            display: inline-block;
            vertical-align: middle;
            z-index: 10;
        }
        .text-input-wrapper input[type="text"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 2px 24px 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            height: 24px;
            line-height: 1.4;
            outline: none;
        }
        .text-input-wrapper input[type="text"]:focus {
            border-color: #666;
        }
        .text-input-wrapper .text-btn {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #555;
            padding: 1px 3px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            z-index: 2;
        }
        .text-input-wrapper .text-btn:hover {
            color: #aaa;
        }

        .text-edit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99999999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }
        .text-edit-overlay.active {
            display: flex;
        }
        .text-edit-overlay .edit-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 18px 22px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }
        .text-edit-overlay .edit-box .edit-title {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .text-edit-overlay .edit-box .edit-title .close-btn {
            background: transparent;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }
        .text-edit-overlay .edit-box .edit-title .close-btn:hover {
            color: #aaa;
        }
        .text-edit-overlay .edit-box textarea {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            max-height: 200px;
            line-height: 1.6;
            outline: none;
        }
        .text-edit-overlay .edit-box textarea:focus {
            border-color: #666;
        }
        .text-edit-overlay .edit-box .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }
        .text-edit-overlay .edit-box .edit-actions button {
            padding: 4px 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .text-edit-overlay .edit-box .edit-actions .btn-confirm {
            background: #2a6b3a;
            color: #fff;
        }
        .text-edit-overlay .edit-box .edit-actions .btn-confirm:hover {
            background: #3a8a4a;
        }
        .text-edit-overlay .edit-box .edit-actions .btn-cancel {
            background: #333;
            color: #aaa;
        }
        .text-edit-overlay .edit-box .edit-actions .btn-cancel:hover {
            background: #444;
            color: #fff;
        }

        #previewContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            background: #0d0d0d;
            position: relative;
        }
        #previewContainer .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
            pointer-events: none;
        }
        #previewContainer .bg-layer.active {
            opacity: 1;
        }
        #previewContainer .bg-layer .mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: background 0.3s ease;
        }

        #previewContent {
            font-size: 50px;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 15px;
            max-width: 92%;
            word-break: break-all;
            cursor: default;
            min-height: 60px;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: font-family 0.15s ease;
            overflow-y: auto;
            width: 100%;
            line-height: 1.4;
            white-space: pre-wrap;
            z-index: 1;
            position: relative;
        }

        .preview-placeholder {
            color: #555;
            font-size: 14px;
            text-align: center;
            padding: 15px;
        }
        .preview-placeholder .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .download-wrapper {
            position: relative;
            display: inline-block;
            z-index: 99999;
        }
        .download-btn {
            background: #2a6b3a;
            border: none;
            color: #fff;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
        }
        .download-btn:hover {
            background: #3a8a4a;
        }
        .download-menu {
            display: none;
            position: fixed;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 4px 0;
            min-width: 120px;
            z-index: 9999999;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.9);
            margin-top: 3px;
        }
        .download-menu.show {
            display: block;
        }
        .download-menu .menu-item {
            padding: 4px 12px;
            cursor: pointer;
            color: #ccc;
            font-size: 12px;
            white-space: nowrap;
        }
        .download-menu .menu-item:hover {
            background: #2a2a2a;
            color: #fff;
        }
        .download-menu .divider {
            height: 1px;
            background: #2a2a2a;
            margin: 2px 8px;
        }

        .info-btn {
            background: #2a2a3a;
            border: 1px solid #444;
            color: #888;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
            flex-shrink: 0;
        }
        .info-btn:hover {
            background: #3a3a4a;
            color: #fff;
            border-color: #555;
        }

        .compare-btn {
            background: #2a3a2a;
            border: 1px solid #444;
            color: #888;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
            flex-shrink: 0;
        }
        .compare-btn:hover {
            background: #3a4a3a;
            color: #fff;
            border-color: #555;
        }

        .info-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }
        .info-overlay.active {
            display: flex;
        }
        .info-overlay .info-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }
        .info-overlay .info-box .info-title {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-overlay .info-box .info-title .close-btn {
            background: transparent;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }
        .info-overlay .info-box .info-title .close-btn:hover {
            color: #aaa;
        }
        .info-overlay .info-box .info-content {
            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }
        .info-overlay .info-box .info-content .key {
            color: #ffa500;
            font-weight: bold;
        }

        .bg-upload-wrapper {
            position: relative;
            display: inline-block;
        }
        .bg-upload-btn {
            background: #2a2a4a;
            border: 1px solid #444;
            color: #aaa;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            height: 24px;
        }
        .bg-upload-btn:hover {
            background: #3a3a5a;
            color: #fff;
            border-color: #555;
        }
        .bg-upload-btn.active {
            background: #4a3a2a;
            border-color: #8a6a3a;
            color: #ffa500;
        }
        .bg-upload-wrapper input[type="file"] {
            display: none;
        }

        .reset-btn {
            background: #4a2a2a;
            border: 1px solid #5a3a3a;
            color: #aa6666;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            height: 24px;
            display: none;
        }
        .reset-btn.show {
            display: inline-block;
        }
        .reset-btn:hover {
            background: #5a3a3a;
            color: #ff8888;
            border-color: #6a4a4a;
        }

        .mask-controls {
            display: none;
            align-items: center;
            gap: 3px;
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #333;
            flex-wrap: nowrap;
            height: 24px;
        }
        .mask-controls.show {
            display: flex;
        }
        .mask-controls label {
            color: #888;
            font-size: 9px;
            white-space: nowrap;
        }
        .mask-controls input[type="range"] {
            width: 50px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
            padding: 0;
            flex-shrink: 0;
        }
        .mask-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #666;
            border-radius: 50%;
            cursor: pointer;
        }
        .mask-controls input[type="range"]::-webkit-slider-thumb:hover {
            background: #888;
        }
        .mask-controls input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #666;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .mask-controls .mask-value {
            color: #aaa;
            font-size: 9px;
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .mask-controls input[type="color"] {
            width: 18px;
            height: 18px;
            padding: 1px;
            border: 1px solid #333;
            border-radius: 2px;
            cursor: pointer;
            background: transparent;
            flex-shrink: 0;
        }

        #fontSize {
            width: 34px;
            padding: 2px 3px;
            font-size: 11px;
            height: 24px;
        }
        #fontSize:focus {
            border-color: #666;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 700px) {
            .toolbar {
                max-height: 72px;
                padding: 3px 5px;
            }
            .mask-controls input[type="range"] {
                width: 35px;
            }
            .text-input-wrapper {
                max-width: 80px;
                min-width: 50px;
            }
            .mask-controls {
                padding: 1px 4px;
                gap: 2px;
            }
            .mask-controls label {
                font-size: 8px;
            }
            .mask-controls .mask-value {
                font-size: 8px;
                min-width: 18px;
            }
            .mask-controls input[type="color"] {
                width: 16px;
                height: 16px;
            }
            .toolbar-font-selector .font-toggle {
                min-width: 80px;
                max-width: 120px;
                font-size: 10px;
            }
            .font-sidebar {
                min-width: 160px;
                max-width: 200px;
            }
            .folder-panel {
                padding: 16px 20px;
            }
            .toolbar-right .label-current {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="content-area">

            <div class="toolbar">
                <button class="option-btn" id="optionBtn">⚙ 选项</button>
                <span class="sep">|</span>

                <label>文字：</label>
                <div class="text-input-wrapper">
                    <input type="text" id="textInput" value="字体预览 ABC 123">
                    <button class="text-btn" id="textBtn">✎</button>
                </div>

                <label>字号：</label>
                <input type="number" id="fontSize" value="50" min="8" max="300" step="5">

                <label>颜色：</label>
                <input type="color" id="colorPicker" value="#ffffff" style="width:18px; height:18px; padding:1px; background:transparent; border:1px solid #333; border-radius:2px; cursor:pointer;">

                <label>背景色：</label>
                <input type="color" id="bgPicker" value="#0d0d0d" style="width:18px; height:18px; padding:1px; background:transparent; border:1px solid #333; border-radius:2px; cursor:pointer;">

                <span class="sep">|</span>

                <div class="bg-upload-wrapper">
                    <button class="bg-upload-btn" id="bgUploadBtn">🖼 图片</button>
                    <input type="file" id="bgFileInput" accept="image/*">
                </div>

                <div class="mask-controls" id="maskControls">
                    <label>蒙版</label>
                    <input type="range" id="maskRange" min="0" max="100" value="50">

                item.className = 'folder-item';

                setTimeout(function() { forceLoad(0); }, 50);
            } else {
                D.preview.innerHTML = '<div class="error-box"><h2>⚠️ 没有字体</h2></div>';
                D.preview.style.fontFamily = 'sans-serif';
                D.currentFontName.textContent = '无字体';
            }
        }

        D.optionBtn.onclick = openFolderPanel;
        D.folderOverlay.onclick = function(e) { if (e.target === this) closeFolderPanel(); };

        // ★★★ 说明 ★★★
        D.infoBtn.onclick = function() { D.infoOverlay.classList.add('active'); };
        D.infoClose.onclick = function() { D.infoOverlay.classList.remove('active'); };
        D.infoOverlay.onclick = function(e) { if (e.target === this) D.infoOverlay.classList.remove('active'); };

        // ★★★ 对比模式 ★★★
        D.compareBtn.onclick = function() {
            window.location.href = '对比模式.html';
        };

        // ★★★ 文字编辑 ★★★
        function openTextEdit() {
            D.textEditArea.value = D.textInput.value;
            D.textEditOverlay.classList.add('active');
            setTimeout(function() { D.textEditArea.focus(); }, 100);
        }

        function closeTextEdit() {
            D.textEditOverlay.classList.remove('active');
        }

        function applyTextEdit() {
            var text = D.textEditArea.value || ' ';
            D.textInput.value = text;
            D.preview.textContent = text;
            closeTextEdit();
        }

        D.textBtn.onclick = function(e) { e.stopPropagation();
            openTextEdit(); };
        D.textEditClose.onclick = closeTextEdit;
        D.textEditCancel.onclick = closeTextEdit;
        D.textEditConfirm.onclick = applyTextEdit;
        D.textEditOverlay.onclick = function(e) { if (e.target === this) closeTextEdit(); };
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeTextEdit(); });

        D.textInput.oninput = function() { D.preview.textContent = this.value || ' '; };

        // ★★★ 固定侧栏 ★★★
        function buildSidebar() {
            var list = D.sidebarList;
            list.innerHTML = '';
            if (!S.fonts.length) {
                var empty = document.createElement('div');
                empty.className = 'sidebar-item';
                empty.textContent = '没有字体';
                list.appendChild(empty);
                return;
            }
            for (var i = 0; i < S.fonts.length; i++) {
                var font = S.fonts[i];
                var item = document.createElement('div');
                item.className = 'sidebar-item' + (i === S.index ? ' active' : '');
                item.textContent = font.name;
                item.dataset.index = i;
                item.onclick = function() {
                    var idx = parseInt(this.dataset.index);
                    forceLoad(idx);
                    if (!S.pinned) {
                        closeSidebar();
                    }
                };
                item.onmouseenter = function() {
                    var idx = parseInt(this.dataset.index);
                    var font = S.fonts[idx];
                    if (font) {
                        var key = 'font_' + idx;
                        if (S.cache.has(key)) {
                            var cached = S.cache.get(key);
                            var family = cached.family + ', "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
                            D.preview.style.fontFamily = family;
                            D.preview.textContent = D.textInput.value || '字体预览';
                        } else {
                            loadFont(font, idx).then(function(result) {
                                S.cache.set('font_' + idx, result);
                                var family = result.family + ', "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
                                D.preview.style.fontFamily = family;
                                D.preview.textContent = D.textInput.value || '字体预览';
                            }).catch(function() {});
                        }
                    }
                };
                item.onmouseleave = function() {
                    var currentFont = S.fonts[S.index];
                    if (currentFont) {
                        var key = 'font_' + S.index;
                        if (S.cache.has(key)) {
                            var cached = S.cache.get(key);
                            var family = cached.family + ', "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
                            D.preview.style.fontFamily = family;
                            D.preview.textContent = D.textInput.value || '字体预览';
                        }
                    }
                };
                list.appendChild(item);
            }
            updatePinIndicator();
        }

        function updateSidebar() {
            var items = D.sidebarList.querySelectorAll('.sidebar-item');
            for (var i = 0; i < items.length; i++) {
                var idx = parseInt(items[i].dataset.index);
                items[i].className = 'sidebar-item' + (idx === S.index ? ' active' : '');
            }
        }

        function openSidebar() {
            D.fontSidebar.classList.add('show');
            D.fontArrow.classList.add('open');
            S.dropOpen = true;
            updatePinIndicator();
            D.sidebarTitleText.textContent = S.pinned ? '字体列表 (已固定)' : '字体列表';
        }

        function closeSidebar() {
            D.fontSidebar.classList.remove('show');
            D.fontArrow.classList.remove('open');
            S.dropOpen = false;
            updatePinIndicator();
            D.sidebarTitleText.textContent = '字体列表';
        }

        function toggleSidebar() {
            if (S.dropOpen) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        function updatePinIndicator() {
            if (S.pinned) {
                D.pinIndicator.className = 'pin-indicator pinned';
                D.pinBtn.classList.add('pinned');
                if (S.dropOpen) {
                    D.sidebarTitleText.textContent = '字体列表 (已固定)';
                }
            } else {
                D.pinIndicator.className = 'pin-indicator';
                D.pinBtn.classList.remove('pinned');
                if (!S.dropOpen) {
                    D.sidebarTitleText.textContent = '字体列表';
                }
            }
        }

        D.pinBtn.onclick = function(e) {
            e.stopPropagation();
            S.pinned = !S.pinned;
            if (S.pinned) {
                openSidebar();
            } else {
                closeSidebar();
            }
            updatePinIndicator();
        };

        D.fontToggle.onclick = function(e) {
            if (e.target.closest('.pin-btn')) return;
            if (S.pinned) {
                S.pinned = false;
                closeSidebar();
                updatePinIndicator();
                return;
            }
            toggleSidebar();
        };

        document.addEventListener('click', function(e) {
            var sel = document.querySelector('.toolbar-font-selector');
            var sidebar = D.fontSidebar;
            if (sel && !sel.contains(e.target) && !sidebar.contains(e.target) && !S.pinned) {
                closeSidebar();
                updatePinIndicator();
            }
        });

        // ★★★ 方向键切换 ★★★
        document.addEventListener('keydown', function(e) {
            var tag = document.activeElement ? document.activeElement.tagName : '';
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (S.fonts.length) {
                    var target = S.index + 1;
                    if (target >= S.fonts.length) target = 0;
                    forceLoad(target);
                }
            }
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                if (S.fonts.length) {
                    var target = S.index - 1;
                    if (target < 0) target = S.fonts.length - 1;
                    forceLoad(target);
                }
            }
        });

        // ★★★ 核心加载 ★★★
        function forceLoad(index) {
            if (!S.fonts.length) return;
            if (index < 0) index = S.fonts.length - 1;
            if (index >= S.fonts.length) index = 0;
            S.index = index;
            var font = S.fonts[index];
            if (!font) return;
            D.currentFontName.textContent = font.name;
            var key = 'font_' + index;
            if (S.cache.has(key)) { S.cache.delete(key); }
            if (S.queue.has(key)) { S.queue.delete(key); }
            if (S.task) { S.task.canceled = true;
                S.task = null; }
            loadAndRender(index);
            updateSidebar();
        }

        function loadAndRender(index) {
            if (!S.fonts.length) return;
            var font = S.fonts[index];
            if (!font) return;
            var task = { canceled: false, font: font, index: index };
            S.task = task;
            var key = 'font_' + index;
            if (S.cache.has(key)) {
                applyFont(S.cache.get(key), font, task);
                return;
            }
            loadFont(font, index).then(function(result) {
                if (task.canceled) return;
                S.cache.set(key, result);
                applyFont(result, font, task);
            }).catch(function() {
                if (task.canceled) return;
                D.preview.innerHTML = '<div class="preview-placeholder"><span class="icon">⚠️</span>' + font.name +
                    '<br><span style="font-size:11px;color:#666;">加载失败</span></div>';
                D.preview.style.fontFamily = 'sans-serif';
            });
        }

        function loadFont(font, index) {
            return new Promise(function(resolve, reject) {
                var id = 'font_' + index;
                if (S.queue.has(id)) { S.queue.get(id).then(resolve).catch(reject); return; }
                var timeout = setTimeout(function() { reject(new Error('超时')); }, 6000);
                var promise = new Promise(function(res) {
                    var family = 'CF_' + index;
                    var ext = font.file.split('.').pop().toLowerCase();
                    var fmt = { woff2: 'woff2', woff: 'woff', otf: 'opentype' } [ext] || 'truetype';
                    var style = document.createElement('style');
                    style.textContent = '@font-face{font-family:\'' + family + '\';src:url(\'' + font.file +
                        '\') format(\'' + fmt + '\');font-display:swap;}';
                    document.head.appendChild(style);
                    var test = document.createElement('div');
                    test.style.cssText =
                        'position:absolute;left:-9999px;top:-9999px;font-family:\'' + family +
                        '\',monospace;font-size:100px;visibility:hidden;';
                    test.textContent = '测试';
                    document.body.appendChild(test);
                    var done = false;
                    var finish = function() {
                        if (done) return;
                        done = true;
                        clearTimeout(timeout);
                        document.body.removeChild(test);
                        res({ family: family, name: font.name, file: font.file });
                    };
                    if (document.fonts) { document.fonts.load('100px \'' + family + '\'').then(finish).catch(finish); } else
                        { setTimeout(finish, 400); }
                });
                S.queue.set(id, promise);
                promise.finally(function() { S.queue.delete(id); });
                promise.then(resolve).catch(reject);
            });
        }

        function applyFont(loaded, font, task) {
            if (task && task.canceled) return;
            var family = loaded.family + ', "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
            D.preview.style.fontFamily = family;
            D.preview.textContent = D.textInput.value || '字体预览';
            D.currentFontName.textContent = font.name;
        }

        // ★★★ 背景 ★★★
        function updateMask() {
            var op = parseInt(D.maskRange.value) / 100;
            var c = D.maskColor.value;
            var r = parseInt(c.slice(1, 3), 16),
                g = parseInt(c.slice(3, 5), 16),
                b = parseInt(c.slice(5, 7), 16);
            D.bgMask.style.background = 'rgba(' + r + ',' + g + ',' + b + ',' + op + ')';
            D.maskValue.textContent = Math.round(op * 100) + '%';
        }

        D.maskRange.oninput = updateMask;
        D.maskColor.oninput = updateMask;

        D.bgUploadBtn.onclick = function() {
            if (S.bgUrl) {
                S.bgVis = !S.bgVis;
                D.bgLayer.classList.toggle('active', S.bgVis);
                D.bgUploadBtn.classList.toggle('active', S.bgVis);
                D.maskControls.classList.toggle('show', S.bgVis);
                D.resetBtn.classList.toggle('show', S.bgVis);
                return;
            }
            D.bgFileInput.click();
        };

        D.bgFileInput.onchange = function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var url = e.target.result;
                S.bgUrl = url;
                S.bgVis = true;
                D.bgLayer.style.backgroundImage = 'url(' + url + ')';
                D.bgLayer.classList.add('active');
                D.bgUploadBtn.classList.add('active');
                D.maskControls.classList.add('show');
                D.resetBtn.classList.add('show');
                D.maskColor.value = '#000000';
                D.maskRange.value = 50;
                updateMask();
            };
            reader.readAsDataURL(file);
            this.value = '';
        };

        D.resetBtn.onclick = function() {
            S.bgUrl = null;
            S.bgVis = false;
            D.bgLayer.classList.remove('active');
            D.bgLayer.style.backgroundImage = '';
            D.bgUploadBtn.classList.remove('active');
            D.maskControls.classList.remove('show');
            this.classList.remove('show');
            D.bgMask.style.background = 'transparent';
            S.cache.clear();
            S.queue.clear();
        };

        // ★★★ 下载 ★★★
        var menuOpen = false;
        D.downloadBtn.onclick = function(e) {
            e.stopPropagation();
            menuOpen = !menuOpen;
            if (menuOpen) {
                var rect = this.getBoundingClientRect();
                D.downloadMenu.style.top = (rect.bottom + 3) + 'px';
                D.downloadMenu.style.left = rect.left + 'px';
                D.downloadMenu.classList.add('show');
            } else { D.downloadMenu.classList.remove('show'); }
        };

        document.onclick = function() { menuOpen = false;
            D.downloadMenu.classList.remove('show'); };

        D.downloadMenu.querySelectorAll('.menu-item').forEach(function(item) {
            item.onclick = function() {
                downloadImage(this.dataset.mode);
                menuOpen = false;
                D.downloadMenu.classList.remove('show');
            };
        });

        function downloadImage(mode) {
            var font = S.fonts[S.index];
            if (!font) { alert('请先选择字体'); return; }
            var isWide = mode.indexOf('wide') !== -1;
            var hasBg = mode.indexOf('background') !== -1;
            var family = 'CF_' + S.index;
            var size = parseInt(D.fontSize.value) || 100;
            var color = D.colorPicker.value;
            var bg = D.bgPicker.value;
            var text = D.preview.textContent || '字体预览';
            var c = document.createElement('canvas');
            var ctx = c.getContext('2d');
            var w, h;
            if (isWide) { w = 1920;
                h = 400; } else {
                var tmp = document.createElement('canvas');
                var tctx = tmp.getContext('2d');
                tctx.font = size + 'px \'' + family + '\', sans-serif';
                var tw = tctx.measureText(text).width;
                var pad = 80;
                w = Math.max(tw + pad * 2, 300);
                h = size * 2 + pad;
            }
            c.width = w;
            c.height = h;
            if (hasBg) { ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h); } else { ctx.clearRect(0, 0, w, h); }
            ctx.font = size + 'px \'' + family + '\', sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            var lines = text.split('\n');
            if (lines.length === 1) { ctx.fillText(text, w / 2, h / 2); } else {
                var lh = size * 1.4;
                var total = lines.length * lh;
                var startY = (h - total) / 2 + lh / 2;
                for (var i = 0; i < lines.length; i++) { ctx.fillText(lines[i], w / 2, startY + i * lh); }
            }
            var link = document.createElement('a');
            link.download = font.name + '_' + (hasBg ? '带背景' : '无背景') + (isWide ? '宽版' : '') + '.png';
            link.href = c.toDataURL('image/png');
            link.click();
        }

        // ★★★ 滚轮 ★★★
        var wheelTimer = null,
            wheelPending = null;
        window.addEventListener('wheel', function(e) {
            var tag = document.activeElement ? document.activeElement.tagName : '';
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
            if (!S.fonts.length || !S.hasSelected) return;
            if (e.target.closest('.toolbar-font-selector')) return;
            if (e.target.closest('.font-sidebar')) return;
            e.preventDefault();
            var delta = e.deltaY > 0 ? 1 : -1;
            var target = S.index + delta;
            if (target < 0) target = S.fonts.length - 1;
            if (target >= S.fonts.length) target = 0;
            var font = S.fonts[target];
            if (font) { D.currentFontName.textContent = font.name; }
            if (wheelTimer) { clearTimeout(wheelTimer);
                wheelTimer = null; }
            wheelPending = target;
            wheelTimer = setTimeout(function() {
                wheelTimer = null;
                if (wheelPending !== null) { forceLoad(wheelPending);
                    wheelPending = null; }
            }, 100);
        }, { passive: false });

        // ★★★ 其他 ★★★
        D.fontSize.oninput = function() { D.preview.style.fontSize = this.value + 'px'; };
        D.colorPicker.oninput = function() { D.preview.style.color = this.value; };
        D.bgPicker.oninput = function() { D.previewContainer.style.background = this.value; };

        // ★★★ 启动 ★★★
        init();
        console.log('✅ 字体工坊已启动');
        console.log('📌 点击📌固定字体列表到右侧');
        console.log('📌 鼠标悬停侧栏字体预览效果，点击切换');
        console.log('📌 点击「对比模式」跳转到对比模式.html');
    </script>
</body>
</html>
