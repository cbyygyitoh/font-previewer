  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f8f8;
      --card-bg: #ffffff;
      --text-color: #000000;
      --border: #dddddd;
      --name-bg: #e9edf4;
      --grid-color: #c8c8d4;
    }
    .dark-mode {
      --bg: #1c1c1c;
      --card-bg: #2b2b2b;
      --text-color: #ffffff;
      --border: #444444;
      --name-bg: #424854;
      --grid-color: #4a4a5a;
    }
    body {
      padding: 30px;
      background: var(--bg);
      transition: 0.3s background;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .top-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .back-btn {
      padding: 0 14px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 15px;
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
    }
    #inputText {
      width: 100%;
      height: 46px;
      font-size: 18px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-color);
    }
    .ctrl-btn {
      height: 46px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 15px;
    }
    .slider-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .slider-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-item label {
      color: var(--text-color);
      white-space: nowrap;
    }
    .slider-item input[type="range"] {
      width: 140px;
    }
    #previewWrap {
      margin-top: 10px;
    }
    .layout-square {
      display: grid;
      grid-template-columns: repeat(auto-fill, 180px);
      gap: 24px;
    }
    .layout-rect {
      display: grid;
      grid-template-columns: repeat(auto-fill, 360px);
      gap: 28px;
    }
    .layout-row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: stretch;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-color);
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mi-grid-on .item-card {
      background-image:
        linear-gradient(to right, var(--grid-color) 0 1px, transparent 0),
        linear-gradient(to bottom, var(--grid-color) 0 1px, transparent 0),
        linear-gradient(to right, var(--grid-color) 0 1px, transparent 0),
        linear-gradient(to bottom, var(--grid-color) 0 1px, transparent 0),
        repeating-linear-gradient(to right, var(--grid-color) 0 1px, transparent 0 6px, var(--grid-color) 6px 7px, transparent 7px 13px),
        repeating-linear-gradient(to bottom, var(--grid-color) 0 1px, transparent 0 6px, var(--grid-color) 6px 7px, transparent 7px 13px),
        linear-gradient(45deg, transparent calc(50% - 0.5px), var(--grid-color) calc(50% - 0.5px), var(--grid-color) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
        linear-gradient(135deg, transparent calc(50% - 0.5px), var(--grid-color) calc(50% - 0.5px), var(--grid-color) calc(50% + 0.5px), transparent calc(50% + 0.5px));
      background-size: 92% 92%, 92% 92%, 100% 100%, 100% 100%, 92% 92%, 92% 92%, 100% 100%, 100% 100%;
      background-position: 4% 4%, 4% 4%, 0 0, 0 0, 4% 50%, 50% 4%, 0 0, 0 0;
      background-repeat: no-repeat;
    }
    .preview-text-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .layout-square .item-card { width: 180px; height: 210px; }
    .layout-rect .item-card { width: 360px; height: 190px; }
    .layout-row .item-card { min-width: 180px; height: 190px; }
    .font-name-row {
      width: 100%;
      height: 16px;
      background: var(--name-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .font-name {
      font-size: 13px;
      font-weight: 200;
      color: var(--text-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1;
    }
    .download-btn {
      position: absolute;
      right: 8px;
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: #5578cc;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
  </style>

    const inputDom = document.getElementById("inputText");
    const previewWrap = document.getElementById("previewWrap");
    const toggleDarkBtn = document.getElementById("toggleDark");
    const toggleGridBtn = document.getElementById("toggleGrid");
    const fontSizeSlider = document.getElementById("fontSizeSlider");
    const fontSizeVal = document.getElementById("fontSizeVal");
    const charSpacingSlider = document.getElementById("charSpacingSlider");
    const charSpacingVal = document.getElementById("charSpacingVal");

    let darkOn = false;
    let gridOn = false;
    let currentFontSize = 72;
    let currentCharSpacing = 0;
    let downloading = false;

    function setCssVar() {
      fontSizeVal.textContent = currentFontSize + "px";
      charSpacingVal.textContent = currentCharSpacing + "px";
    }

    async function downloadCard(elem, fontName) {
      if (downloading) return;
      downloading = true;
      const clone = elem.cloneNode(true);
      clone.querySelector(".font-name-row").remove();
      clone.style.background = "transparent";
      clone.style.position = "absolute";
      clone.style.left = "-9999px";
      document.body.appendChild(clone);
      const canvas = await html2canvas(clone, {
        backgroundColor: null,
        useCORS: true,
        scale: 2
      });
      document.body.removeChild(clone);
      const link = document.createElement("a");
      link.download = fontName + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      downloading = false;
    }

    function splitTextSpan(text, spacePx) {
      let html = "";
      const half = spacePx / 2;
      for (let i = 0; i < text.length; i++) {
        html += `<span style="margin-left:${half}px;margin-right:${half}px">${text[i]}</span>`;
      }
      return html;
    }

    function renderPreview(text) {
      if (!text.trim()) {
        previewWrap.innerHTML = "<div style='color:#999'>请在上方输入预览文字</div>";
        return;
      }
      const len = text.length;
      let layoutClass;
      if (len === 1) layoutClass = "layout-square";
      else if (len === 2) layoutClass = "layout-rect";
      else layoutClass = "layout-row";

      let html = `<div class="${layoutClass} ${gridOn ? 'mi-grid-on' : ''}">`;
      fontList.forEach(font => {
        const spanHtml = splitTextSpan(text, currentCharSpacing);
        html += `
          <div class="item-card">
            <div class="preview-text-wrap">
              <div style="font-family:'${font.family}';font-size:${currentFontSize}px;line-height:1;display:flex;align-items:center;justify-content:center">${spanHtml}</div>
            </div>
            <div class="font-name-row">
              <span class="font-name">${font.name}</span>
              <button class="download-btn" data-font="${font.name}">↓</button>
            </div>
          </div>
        `;
      });
      html += "</div>";
      previewWrap.innerHTML = html;

      document.querySelectorAll(".download-btn").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const card = e.target.closest(".item-card");
          const fname = e.target.dataset.font;
          downloadCard(card, fname);
        };
      });
    }

    inputDom.addEventListener("input", (e) => {
      renderPreview(e.target.value.trim());
    });

    toggleDarkBtn.onclick = () => {
      darkOn = !darkOn;
      document.body.classList.toggle("dark-mode", darkOn);
    };

    toggleGridBtn.onclick = () => {
      gridOn = !gridOn;
      toggleGridBtn.innerText = gridOn ? "关闭米字格" : "打开米字格";
      if (inputDom.value.trim()) renderPreview(inputDom.value.trim());
    };

    fontSizeSlider.oninput = () => {
      currentFontSize = Number(fontSizeSlider.value);
      setCssVar();
      if (inputDom.value.trim()) renderPreview(inputDom.value.trim());
    };

    charSpacingSlider.oninput = () => {
      currentCharSpacing = Number(charSpacingSlider.value);
      setCssVar();
      if (inputDom.value.trim()) renderPreview(inputDom.value.trim());
    };

    setCssVar();
